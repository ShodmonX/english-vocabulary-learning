  unavailable_full: "⚠️ Hozircha level test mavjud emas."
  full_requires_quick_redirect: "ℹ️ Avval kamida 1 ta tez testni tugatish kerak. Siz avtomatik tez testga yo‘naltirildingiz."
  full_start_from_level: "ℹ️ Full test {level} bosqichidan boshlandi."
  promo_next_stage: "🎉 Tabriklaymiz! Siz keyingi ({next_level}) bosqichga yo‘naltirildingiz."
  credit_not_enough: "⚠️ Kredit yetarli emas."
  paid_blocked: |
    {detail}

    Siz {next_date} da keyingi tekin imtihonni topshira olasiz. Omad!
  header: "🧪 {test_name} ({total} savol / {minutes} min)"
  progress: "Savol {index}/{total} | 📝{answered} ⏭{skipped} 🚩{flagged} | ⏳ {time_left}"
  time_left: "⏳ {time_left}"
  typing_hint: "✍️ Javobni matn ko‘rinishida yuboring (1-2 so‘z)."
  typing_only: "✍️ Bu typing savol. Javobni matn ko‘rinishida yuboring."
  mcq_only: "🧩 Bu MCQ savol. Variant tugmalaridan birini bosing."
  flagged_mode: "🚩 Flagged mode"
  stop_confirm: "Testni to‘xtatasizmi? (Unanswered = incorrect)"
  status_finished: "Finished"
  status_expired: "Expired (time is over)"
  status_cancelled: "Stopped by user"
  status_unknown: "Completed"
