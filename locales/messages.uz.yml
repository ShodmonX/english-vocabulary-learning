level_test:
  name_quick: "Tez test"
  name_full: "Level test"
  title: "🧪 CEFR Level Test"
  start: |
    🧪 CEFR Level Test

    Mavjud rejimlar:
    - ⚡ Tez test
    - 🎯 Full test
  about: |
    ℹ️ Bu test sizning CEFR bo‘yicha taxminiy darajangizni ko‘rsatadi.

    Rejimlar:
    - ⚡ Tez test: kirish baholash (placement)
    - 🎯 Full test: kamida 1 ta tugatilgan tez testdan keyin
      va o‘sha natijadagi bosqichdan boshlanadi.
    Har ikkisi:
    - 30 savol (MCQ + typing)
    - 15 daqiqa hard-stop
