    📌 {test_name} yakuni ({status})

    Natija: {score_pct}%
    To‘g‘ri javoblar: {correct}
    Javob berilgan: {answered}/{total}
    Taxminiy daraja: {level}
    Sarflangan vaqt: {elapsed}
  no_active: "Faol level test topilmadi."
  question_changed: "Savol allaqachon yangilangan."

help_content:
  status_on: "ochiq"
  status_off: "o‘chiq"
  enabled: "yoqilgan"
  disabled: "o‘chirilgan"
  streak_line: "🔥 Sizning streak: {streak} kun"
  streak_none: "🔥 Streak: hali yo‘q"
  notification_line: "⏰ Eslatma: {time}"
  notification_off: "⏰ Eslatma: o‘chiq"
  quick_start_first_empty: |
    1) Avval 3 ta so‘z qo‘shing.
    2) 📚 Mashq qilish → due so‘zlar.
    3) 😄/🙂/😐/😕 baholash bosing.
  quick_start_first_default: |
    1) 📚 Mashq qilish → due so‘zlar.
    2) Baholash tugmalaridan birini bosing.
  quick: |
    📌 Tez start

    Nima? Bot sizga SRS asosida so‘zlarni qayta ko‘rsatadi.

    Qanday ishlaydi?
    {quick_start_first}

    Tezkor misol:
    abandon → tarjima → misol → saqlash

    Tugmalar:
    - 📚 Mashq qilish: due so‘zlar
    - ➕ So‘z qo‘shish: yangi so‘z
    - {streak_line}
  add: |
    ➕ So‘z qo‘shish

    Nima? Yangi so‘z va tarjimani bazaga qo‘shasiz.

    Qanday ishlaydi?
    1) So‘zni yuborasiz
    2) Tarjima tavsiya qilinadi
    3) Misol yozasiz yoki o‘tkazasiz

    Tezkor misol:
    abandon → tashlab ketmoq → misol → ✅ saqlandi

    Ko‘p xato:
    - Bo‘sh so‘z yuborish
    - Juda uzun matn

    Tugmalar:
    - ✅ Davom etish
    - 🔄 Boshqa tarjima
    - ⏭ Misolni o‘tkazish
  srs: |
    🔁 Bugungi takrorlash (SRS)

    Nima? Faqat due so‘zlar ko‘rsatiladi.

    Qanday ishlaydi?
    - Due so‘zlar: {due_count}
    - SM-2 baholash: AGAIN/HARD/GOOD/EASY

    Tezkor misol:
    😕 Bilmayman → tezroq qaytadi
    😄 Oson → uzoqroq qaytadi

    Ko‘p xato:
    - Due=0 bo‘lsa so‘z chiqmaydi
    - “Yangi so‘zlar bilan mashq”ni tasdiqlash kerak

    Tugmalar:
    - 😕 Bilmayman (AGAIN)
    - 😐 Qiyin (HARD)
    - 🙂 Yaxshi (GOOD)
    - 😄 Oson (EASY)
  quiz: |
    🧩 Quiz

    Nima? Tarjima beriladi, 4 variantdan so‘zni topasiz.

    Qanday ishlaydi?
    - Savollar soni: {quiz_size}
    - To‘g‘ri → SRS yangilanadi
    - Xato → SRS pastga tushadi

    Tezkor misol:
    Tarjima: tashlab ketmoq → abandon

    Ko‘p xato:
    - 4 ta so‘zdan kam bo‘lsa quiz ochilmaydi

    Tugmalar:
    - A/B/C/D variantlar
  pron: |
    🗣 Talaffuz

    Nima? O‘zingiz qo‘shgan so‘zlarni aytasiz, bot tekshiradi.

    Holat: {pron_status} (global), sozlamada: {pron_user_status}

    Qanday ishlaydi?
    - Single: bitta so‘z tekshirish
    - Quiz: ketma-ket test

    Tezkor misol:
    🎯 Ayting: abandon → voice yuboring (5–10s)

    Ko‘p xato:
    - Juda uzun audio
    - Shovqinli muhit

    Tugmalar:
    - 🔁 Qayta urinish
    - 🗂 Boshqa so‘z
  words: |
    🗂 So‘zlarni boshqarish

    Nima? So‘zlarni qidirish, tahrirlash, o‘chirish.

    Qanday ishlaydi?
    - 🔎 Qidirish (substring/prefix)
    - 🕒 Oxirgilar (pagination)
    - Detail → Edit/Delete

    Ko‘p xato:
    - Bir xil so‘z qo‘shish (unique)
    - Tahrirda duplicate so‘z

    Tugmalar:
    - ✏️ Tahrirlash
    - 🗑 O‘chirish
    - ◀️ Orqaga
  settings: |
    ⚙️ Sozlamalar

    Nima? Mashq, quiz, talaffuz va bildirishnomalarni boshqarasiz.

    Sizda hozir:
    - Quiz savollari: {quiz_size}
    - Avto tarjima: {translation_status}
    - {notif_line}

    Ko‘p xato:
    - Noto‘g‘ri vaqt formati (HH:MM)

    Tugmalar:
    - 🧠 O‘rganish
    - 🧩 Testlar
    - 🌍 Til & Tarjima
  trouble: |
    🧩 Muammolar va yechimlar

    1) So‘z qo‘sholmayapman
    - Sabab: bo‘sh so‘z yoki dublikat
    - Yechim: boshqa so‘z kiriting

    2) Takrorlashda so‘z chiqmayapti
    - Sabab: due=0
    - Yechim: “Yangi so‘zlar bilan mashq”ni tasdiqlang

    3) Talaffuzda xato chiqyapti
    - Sabab: audio uzun/shovqin
    - Yechim: 5–10s va sokin joy

    4) Tarjima noto‘g‘ri chiqdi
    - Yechim: to‘g‘ri tarjimani qo‘lda yozing

    5) Bot javob bermay qoldi
    - Yechim: /start qayta bosing

    6) Inline tugmalar ishlamayapti
    - Yechim: chatni yangilang yoki Telegram’ni qayta oching
  privacy: |
    🔐 Maxfiylik / Ma’lumotlar

    Nima saqlanadi?
    - Telegram ID, so‘zlar, mashq natijalari

    Nima saqlanmaydi?
    - Maxfiy parollar yoki shaxsiy fayllar

    Audio:
    - Talaffuz uchun yuborilgan audio vaqtinchalik qayta ishlanadi

    O‘chirish:
    - So‘zlarni “So‘zlarim” bo‘limida o‘chirishingiz mumkin
  admin: |
    🛠 Admin

    Nima? Monitoring va boshqaruv.

    Bo‘limlar:
    - 📊 Statistika
    - 👥 Userlar
    - 🧠 SRS nazorati
    - 📘 Kontent nazorati
    - 🗄 Database Management
    - ⚙️ Feature flag’lar
    - 🧪 Debug / Maintenance

